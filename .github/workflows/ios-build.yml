name: iOS compile and pairing tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    branches: ["main"]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Test pairing parser (Debug and Release)
        working-directory: ios
        run: |
          swift test
          swift test -c release

      - name: Compile native app for iPhone without signing
        run: >-
          xcodebuild -project ios/VirtualCamera.xcodeproj -scheme VirtualCamera
          -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Compile production configuration
        run: >-
          xcodebuild -project ios/VirtualCamera.xcodeproj -scheme VirtualCamera
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned IPAs for Sideloadly
        run: |
          mkdir -p ios/build
          for config in Debug Release; do
            rm -rf ios/build/Payload
            mkdir -p ios/build/Payload
            cp -R ios/DerivedData/Build/Products/$config-iphoneos/VirtualCamera.app ios/build/Payload/
            (cd ios/build && zip -qr 12F-Virtual-Camera-$config-unsigned.ipa Payload)
          done
          rm -rf ios/build/Payload

      - name: Simulator launch smoke and screenshot
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project ios/VirtualCamera.xcodeproj -scheme VirtualCamera -configuration Debug -sdk iphonesimulator -destination "id=$DEVICE" -derivedDataPath ios/SimulatorData CODE_SIGNING_ALLOWED=NO build
          xcrun simctl install "$DEVICE" ios/SimulatorData/Build/Products/Debug-iphonesimulator/VirtualCamera.app
          xcrun simctl launch "$DEVICE" studio.12frames.virtualcamera
          sleep 4
          xcrun simctl io "$DEVICE" screenshot ios/build/12F-connection-screen.png
          xcrun simctl terminate "$DEVICE" studio.12frames.virtualcamera

      - uses: actions/upload-artifact@v4
        with:
          name: 12F-iOS-unsigned-apps
          path: |
            ios/build/*.ipa
            ios/build/*.png
          retention-days: 7
